name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  build:
    name: Build PiAuditor IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          for xc in /Applications/Xcode_16*.app /Applications/Xcode.app; do
            if [ -d "$xc" ]; then
              echo "Selecting $xc"
              sudo xcode-select -s "$xc"
              break
            fi
          done
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        working-directory: ios
        run: |
          xcodegen generate

      - name: Build Application for Device (Unsigned)
        run: |
          xcodebuild -project ios/PiAuditor.xcodeproj \
            -scheme PiAuditor \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            clean build

      - name: Package Payload into IPA
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: PiAuditor.app not found!"
            exit 1
          fi
          echo "Found compiled app at: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -9 PiAuditor-unsigned.ipa Payload
          ls -lh PiAuditor-unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PiAuditor-unsigned-ipa
          path: PiAuditor-unsigned.ipa
          retention-days: 14

      - name: Upload to Release (if applicable)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: PiAuditor-unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
