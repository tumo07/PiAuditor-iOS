name: PiAuditor
options:
  bundleIdPrefix: vn.io.tumo07
  deploymentTarget:
    iOS: '16.0'
  xcodeVersion: '15.0'

targets:
  PiAuditor:
    type: application
    platform: iOS
    sources:
      - path: PiAuditor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.io.tumo07.PiAuditor
        INFOPLIST_FILE: PiAuditor/Info.plist
        IPHONEOS_DEPLOYMENT_TARGET: '16.0'
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        ENABLE_PREVIEWS: YES
        SWIFT_VERSION: '5.9'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
